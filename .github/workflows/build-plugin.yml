name: Build YouTube Music plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out matching MetroFuse SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 956tris/MetroFuse
          ref: 775b387755449c9e7f74d9c6d9e80b27b2a971bb
          path: .ci/metrofuse
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android packaging tools
        run: sdkmanager "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0"
      - name: Export MetroFuse API and SDK
        working-directory: .ci/metrofuse
        run: bash ./gradlew :plugin-api:desktopJar :plugin-sdk:desktopJar --no-daemon --no-configuration-cache
      - name: Test and build native packages
        run: |
          bash ./gradlew :native:desktopTest :native:packagePluginJar :native:packagePluginApk \
            "-PmetrofuseApiJar=$GITHUB_WORKSPACE/.ci/metrofuse/plugin-api/build/libs/plugin-api-desktop-1.1.0.jar" \
            "-PmetrofuseSdkJar=$GITHUB_WORKSPACE/.ci/metrofuse/plugin-sdk/build/libs/plugin-sdk-desktop-1.1.0.jar" \
            --no-daemon --no-configuration-cache
      - name: Test and package the JavaScript plugin
        run: |
          node native/tests/javascript.mjs
          python3 tools/package-mfp.py
      - name: Verify archives and write checksums
        run: |
          mkdir -p build/distribution
          cp native/build/outputs/plugins/youtube-music.{jar,apk} build/outputs/plugins/youtube-music.mfp build/distribution/
          cd build/distribution
          for file in youtube-music.{jar,apk,mfp}; do python3 -m zipfile -t "$file"; done
          sha256sum youtube-music.{jar,apk,mfp} > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: youtube-music-plugin
          path: |
            build/distribution/youtube-music.jar
            build/distribution/youtube-music.apk
            build/distribution/youtube-music.mfp
            build/distribution/SHA256SUMS
          if-no-files-found: error
